
services:
  postgres:
    image: postgres:17-alpine
    container_name: movies-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies_db}
      POSTGRES_USER: ${POSTGRES_USER:-movies_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-movies_user} -d ${POSTGRES_DB:-movies_db}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
